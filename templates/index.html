<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrapper" style="max-width: 720px;">

        <div class="header">
            <div class="header-tag">Secure Facility</div>
            <h1>Visitor <span>Check-In</span></h1>
        </div>

        <div class="card">
            <form action="/add" method="post">

                <div class="section-label">Identity</div>
                <div class="grid-2">
                    <div class="field">
                        <label for="emp_id">Employee ID</label>
                        <input type="text" id="emp_id" name="emp_id" placeholder="e.g. EMP-0042" required>
                    </div>
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="field span-2">
                        <label for="phone_no">Phone Number</label>
                        <input type="text" id="phone_no" name="phone_no" placeholder="+91 00000 00000">
                    </div>
                </div>

                <div class="section-label">Visit Details</div>
                <div class="grid-2">
                    <div class="field span-2">
                        <label for="purpose">Purpose of Visit</label>
                        <input type="text" id="purpose" name="purpose" placeholder="Meeting, Delivery, Interview..." required>
                    </div>
                    <div class="field">
                        <label for="checkin">Check-In Time</label>
                        <input type="time" id="checkin" name="checkin">
                    </div>
                    <div class="field">
                        <label for="checkout">Check-Out Time</label>
                        <input type="time" id="checkout" name="checkout">
                    </div>
                    <div class="field">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date">
                    </div>
                </div>

                <div class="section-label">Photo Capture</div>
                <div class="camera-card">
                    <div class="camera-feed">
                        <video id="video" autoplay playsinline></video>
                        <div class="camera-overlay"></div>
                        <div class="camera-status">Live Feed</div>
                    </div>
                    <div class="camera-actions">
                        <span class="capture-hint" id="captureHint">Position face in frame</span>
                        <span class="captured-badge" id="capturedBadge">Photo captured</span>
                        <button type="button" class="btn-capture" onclick="capture()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M3 9a2 2 0 0 1 2-2h1l2-2h8l2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/>
                            </svg>
                            Capture
                        </button>
                    </div>
                </div>

                <canvas id="canvas" width="320" height="240"></canvas>
                <input type="hidden" name="photo" id="photo">

                <button type="submit">Submit Check-In →</button>

            </form>
        </div>

        <a href="/visitors" class="footer-link">↗ View All Visitors</a>

    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoInput = document.getElementById('photo');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(() => {
                document.querySelector('.camera-status').textContent = 'Camera unavailable';
            });

        function capture() {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            photoInput.value = canvas.toDataURL('image/jpeg');

            document.getElementById('captureHint').style.display = 'none';
            document.getElementById('capturedBadge').classList.add('show');
        }
    </script>
</body>
</html>
